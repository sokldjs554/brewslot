<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrewSlot 데모</title>
<meta name="description" content="픽업 시간을 고르면 그 시각에 맞춰 만들어 주는 카페 주문 서비스 — 고객 앱과 매장 화면 데모">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236b4226'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EB%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f1ed; --panel: #ffffff; --panel2: #faf8f6; --ink: #1f1b18; --ink2: #5a534d; --muted: #8b847d; --line: #e5dfd8;
  --accent: #6b4226; --accent-soft: #f1e7df; --on-accent: #ffffff;
  --good: #1d7f4a; --good-soft: #e3f3ea; --warn: #9a6200; --warn-soft: #fbf0d9; --bad: #b3261e; --bad-soft: #fbe6e4;
  --espresso: #8a5a33; --blender: #c43d67; --brew: #1f7373;
  --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 24px rgb(0 0 0 / .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151311; --panel: #1f1c19; --panel2: #25221f; --ink: #f1ece6; --ink2: #c3bbb2; --muted: #8f877f; --line: #36312c;
    --accent: #c8906a; --accent-soft: #3a2b21; --on-accent: #1a120c;
    --good: #5cc98c; --good-soft: #17301f; --warn: #e2b04a; --warn-soft: #36290f; --bad: #f08a80; --bad-soft: #3a1b18;
    --espresso: #c99366; --blender: #ee7ea0; --brew: #5fbcbc;
    --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151311; --panel: #1f1c19; --panel2: #25221f; --ink: #f1ece6; --ink2: #c3bbb2; --muted: #8f877f; --line: #36312c;
  --accent: #c8906a; --accent-soft: #3a2b21; --on-accent: #1a120c;
  --good: #5cc98c; --good-soft: #17301f; --warn: #e2b04a; --warn-soft: #36290f; --bad: #f08a80; --bad-soft: #3a1b18;
  --espresso: #c99366; --blender: #ee7ea0; --brew: #5fbcbc;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
.num { font-variant-numeric: tabular-nums; }

/* ── top bar ── */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 15px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 13px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.clock { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.clock .time { font-size: 22px; font-weight: 800; letter-spacing: .5px; min-width: 96px; text-align: right; }
.clock .lbl { color: var(--muted); font-size: 12px; }
.ctl { display: flex; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.ctl button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.ctl button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
#btnCodes[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.devpanel { position: fixed; right: 16px; bottom: 16px; z-index: 30; width: min(460px, calc(100vw - 32px)); max-height: 46vh; display: flex; flex-direction: column;
  background: #1b1815; color: #efe9e2; border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.35); font-size: 12.5px; }
.devpanel[hidden] { display: none; }
.devpanel .dh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #3a342e; }
.devpanel .dh b { font-size: 13px; } .devpanel .dh small { color: #a79e95; flex: 1; }
.devpanel .dh button { background: none; border: 0; color: #cfc6bc; font-size: 16px; }
.devpanel ul { list-style: none; margin: 0; padding: 6px 14px 10px; overflow: auto; }
.devpanel li { padding: 6px 0; border-bottom: 1px dashed #3a342e; line-height: 1.45; }
.devpanel li .t { color: #a79e95; margin-right: 6px; }
.devpanel li code { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 6px; background: #3b2f25; color: #f2c9a0; font-size: 11.5px; }
.devpanel .empty2 { padding: 14px; color: #bdb4aa; line-height: 1.6; }
.devpanel { width: min(560px, calc(100vw - 32px)); max-height: 60vh; }
.devpanel .dbody { overflow: auto; }
.devpanel .dtabs { display: flex; gap: 2px; background: #2a2521; border-radius: 8px; padding: 2px; flex: 1; }
.devpanel .dtabs button { flex: 1; background: none; border: 0; color: #bdb4aa; padding: 4px 6px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.devpanel .dtabs button[aria-pressed="true"] { background: #4a3b2e; color: #fff; }
.devpanel .meta { color: #a79e95; font-size: 11.5px; margin-top: 2px; }
.devpanel .meta a, .devpanel .dev-note a { color: #f2c9a0; }
.devpanel .topic { color: #9fd3b0; }
.devpanel pre { margin: 4px 0 0; padding: 6px 8px; background: #25201c; border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-size: 11px; color: #d9d1c8; }
.devpanel .st { font-weight: 700; padding: 0 5px; border-radius: 5px; } .devpanel .s2 { background: #264a33; color: #b9f0c9; } .devpanel .s4 { background: #5a2a24; color: #ffc9bf; }
.devpanel .m-GET { color: #9fc7ff; } .devpanel .m-POST { color: #ffd59f; }
.devpanel .dev-note { padding: 10px 14px 4px; color: #cfc6bc; line-height: 1.55; }
.devpanel .dev-h { padding: 10px 14px 2px; font-weight: 700; color: #efe9e2; }
.devpanel .dev-tbl { width: calc(100% - 28px); margin: 4px 14px 6px; border-collapse: collapse; font-size: 11.5px; }
.devpanel .dev-tbl th, .devpanel .dev-tbl td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #3a342e; }
.devpanel .dev-tbl .r { text-align: right; }
.devpanel .dev-tbl th { background: #2a2521; color: #cfc6bc; font-weight: 600; position: static; }
.devpanel .dev-tbl td { background: transparent; color: #efe9e2; }
.devpanel .dev-tbl code { background: none; color: #f2c9a0; padding: 0; }
.switch-view { display: none; }

/* ── layout ── */
.stage { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 24px; padding: 20px; max-width: 1480px; margin: 0 auto; align-items: start; }
.col-title { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .4px; margin: 0 0 8px 4px; }

/* ── phone ── */
.phone { position: sticky; top: 76px; width: 100%; height: min(780px, calc(100vh - 110px)); min-height: 560px; border-radius: 36px; background: var(--panel); border: 10px solid #111; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.ph-status { display: flex; justify-content: space-between; padding: 8px 20px 4px; font-size: 12px; font-weight: 700; }
.ph-head { padding: 6px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; min-height: 52px; }
.ph-head .back { border: 0; background: transparent; font-size: 24px; padding: 0 4px 0 0; line-height: 1; }
.ph-head h2 { margin: 0; font-size: 17px; }
.ph-head .sub { font-size: 12px; color: var(--muted); }
.ph-head .pts { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.ph-body { flex: 1; overflow-y: auto; padding: 14px 16px 16px; position: relative; }
.ph-nav { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--panel); }
.ph-nav button { border: 0; background: transparent; padding: 9px 0 12px; font-size: 12px; font-weight: 600; color: var(--muted); position: relative; }
.ph-nav button[aria-current="page"] { color: var(--accent); }
.ph-nav .ico { display: block; font-size: 18px; line-height: 1.2; }
.ph-nav .dot { position: absolute; top: 6px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.cartbar { position: sticky; bottom: -16px; margin: 18px -16px -16px; padding: 14px 12px 12px; background: linear-gradient(to bottom, transparent, var(--panel) 30%); }
.primary { width: 100%; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); padding: 14px 16px; font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
.primary:disabled { opacity: .45; }
.secondary { width: 100%; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 12px 16px; font-size: 14px; font-weight: 600; }
.banner { border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.banner .chip { border-color: currentColor; color: inherit; background: var(--panel); }
.menu-list { list-style: none; margin: 12px 0 0; padding: 0; }
.menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.thumb { width: 52px; height: 52px; border-radius: 14px; flex: none; display: grid; place-items: center; font-size: 24px; background: var(--panel2); border: 1px solid var(--line); }
.menu-item .nm { font-weight: 700; }
.menu-item .pr { color: var(--ink2); font-size: 13px; font-weight: 600; }
.menu-item .desc { color: var(--muted); font-size: 12px; }
.menu-item .grow { flex: 1; min-width: 0; }
.menu-item.out { opacity: .45; }
.add { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.stepper button { border: 0; background: var(--panel2); width: 30px; height: 30px; font-size: 16px; font-weight: 700; }
.stepper span { min-width: 28px; text-align: center; font-weight: 700; }
.section-h { font-size: 15px; font-weight: 800; margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.section-h small { font-weight: 500; color: var(--muted); font-size: 12px; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border: 1.5px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 4px; text-align: center; }
.slot b { display: block; font-size: 15px; }
.slot span { font-size: 11px; font-weight: 700; }
.slot .lv-ok { color: var(--good); } .slot .lv-mid { color: var(--warn); } .slot .lv-busy { color: var(--bad); }
.slot:disabled { background: var(--panel2); color: var(--muted); border-style: dashed; }
.slot:disabled span { color: var(--muted); }
.slot[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.line-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.line-row .grow { flex: 1; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; }
.kv.total { font-weight: 800; font-size: 16px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.kv .m { color: var(--muted); }
.card-opt { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); width: 100%; text-align: left; }
.card-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.card-opt .cc { width: 36px; height: 24px; border-radius: 5px; background: linear-gradient(135deg, #3b3b58, #6b6b8c); flex: none; }
.card-opt .cc.red { background: linear-gradient(135deg, #7a2d2d, #b35b5b); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); width: 100%; text-align: left; font-weight: 600; }
.sw { width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .3); }
[aria-checked="true"] .sw { background: var(--good); }
[aria-checked="true"] .sw::after { left: 19px; }
.hold { text-align: center; padding: 14px; border-radius: 14px; background: var(--accent-soft); margin-bottom: 14px; }
.hold .cd { font-size: 26px; font-weight: 800; }
.hold .t { font-size: 13px; color: var(--ink2); }
.bignum { text-align: center; padding: 14px 0 6px; }
.bignum .no { font-size: 40px; font-weight: 900; letter-spacing: 1px; }
.bignum .msg { font-size: 16px; font-weight: 700; margin-top: 4px; }
.bignum .msg2 { font-size: 13px; color: var(--muted); }
.track { list-style: none; margin: 18px 0; padding: 0; }
.track li { display: flex; gap: 12px; padding: 0 0 16px; position: relative; }
.track li::before { content: ""; position: absolute; left: 9px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.track li:last-child::before { display: none; }
.track li.done::before { background: var(--accent); }
.track .b { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); flex: none; display: grid; place-items: center; font-size: 11px; color: var(--on-accent); }
.track li.done .b { background: var(--accent); border-color: var(--accent); }
.track li.now .b { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.track .tt { font-weight: 700; }
.track .ts { font-size: 12px; color: var(--muted); }
.order-card { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--panel); margin-bottom: 10px; }
.order-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--ink2); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.toast { position: sticky; top: -2px; z-index: 5; margin: -4px 0 12px; background: var(--ink); color: var(--panel); border-radius: 14px; padding: 12px 14px; font-weight: 600; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; animation: drop .25s ease-out; }
.toast button { margin-left: auto; border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; white-space: nowrap; }
@keyframes drop { from { transform: translateY(-10px); opacity: 0; } }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.mebox { border-radius: 16px; padding: 16px; background: var(--accent); color: var(--on-accent); margin-bottom: 14px; }
.mebox .p { font-size: 26px; font-weight: 800; }
.promo { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; background: linear-gradient(135deg, var(--accent-soft), var(--panel2)); border: 1px solid var(--line); }
.promo .ic { font-size: 22px; }
.promo .tx { flex: 1; font-size: 13px; line-height: 1.35; }
.promo .tx b { display: block; font-size: 14px; }
.promo button { border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); padding: 7px 10px; font-weight: 700; font-size: 12px; white-space: nowrap; }
.promise { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.promise span { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
.promise .big { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.evts { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); margin-left: 4px; }
.evts li { position: relative; padding: 0 0 10px 14px; font-size: 13px; }
.evts li::before { content: ""; position: absolute; left: -6px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.evts .t { color: var(--muted); font-size: 11px; margin-right: 6px; }
.evts code { font-size: 10.5px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; margin-left: 4px; }
.spin { display: inline-block; width: 16px; height: 16px; border: 2.5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.9s linear infinite; vertical-align: -3px; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ── store console ── */
.console { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; }
.con-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.con-head h2 { margin: 0; font-size: 16px; }
.tabs { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 700; color: var(--muted); font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.kpi { padding: 12px 18px; border-right: 1px solid var(--line); }
.kpi:last-child { border-right: 0; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: 22px; font-weight: 800; }
.kpi .v small { font-size: 13px; color: var(--muted); font-weight: 600; }
.con-body { padding: 16px 18px 20px; }
.bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 12px; }
.kds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.lane { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 360px; min-width: 0; }
.lane h3 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.lane h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.lane h3 .c { margin-left: auto; color: var(--muted); font-weight: 600; }
.lane .grp { font-size: 11px; font-weight: 700; color: var(--muted); margin: 10px 2px 6px; }
.lane .none { font-size: 12px; color: var(--muted); margin: 0 2px 6px; }
.tk { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 8px 9px; margin-bottom: 7px; }
.tk.now { border-left-color: var(--accent); }
.tk.late { border-left-color: var(--bad); background: var(--bad-soft); }
.tk.mine { outline: 2px solid var(--accent); outline-offset: -1px; }
.tk .h { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.tk .no { font-weight: 800; font-size: 15px; }
.tk .pk { font-size: 12px; color: var(--ink2); }
.tk ul { margin: 4px 0 6px; padding: 0; list-style: none; font-size: 13px; }
.tk .act { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tk .act small { color: var(--muted); font-size: 11px; }
.tk.late .act small { color: var(--bad); font-weight: 700; }
.done-btn { border: 0; border-radius: 8px; background: var(--good); color: #fff; font-weight: 700; padding: 5px 10px; font-size: 12px; }

<script src="scheduler.js"></script>
<script>
(() => {
  'use strict';
  const S = globalThis.BrewScheduler;
  const $ = (id) => document.getElementById(id);
  const DAY = 1790546400; // 2026-09-28 07:00 KST (epoch 초)
  const T = (h, m) => DAY + ((h - 7) * 60 + m) * 60;
  const pad = (n) => String(n).padStart(2, '0');
  const clockOf = (t) => { const s = t - DAY + 7 * 3600; return [Math.floor(s / 3600) % 24, Math.floor((s % 3600) / 60), s % 60]; };
  const hhmm = (t) => { const [h, m] = clockOf(t); return pad(h) + ':' + pad(m); };
  const hhmmss = (t) => { const [h, m, s] = clockOf(t); return pad(h) + ':' + pad(m) + ':' + pad(Math.floor(s)); };
  const won = (n) => n.toLocaleString('ko-KR') + '원';
  const SLOT = S.SLOT;
  const HOLD_SEC = 300; // 서버 brewslot.order.hold-ttl 과 같은 5분
  const PG_RECOVERY_SEC = 30; // PG 응답이 없을 때 결과를 다시 조회해 확정하기까지

  const STATION = {
    ESPRESSO: { name: '에스프레소 바', color: 'var(--espresso)' },
    BLENDER: { name: '블렌더', color: 'var(--blender)' },
    BREW_BAR: { name: '브루 바', color: 'var(--brew)' },
  };
  const MENU = [
    { id: 1, name: '아이스 아메리카노', price: 3500, station: 'ESPRESSO', load: 1, fresh: 10, cat: 'coffee', icon: '🧊', desc: '고소한 하우스 블렌드', w: 30 },
    { id: 2, name: '아메리카노', price: 3500, station: 'ESPRESSO', load: 1, fresh: 5, cat: 'coffee', icon: '☕', desc: '따뜻하게 · 픽업 직전에 내려요', w: 14 },
    { id: 3, name: '카페라떼', price: 4500, station: 'ESPRESSO', load: 2, fresh: 5, cat: 'coffee', icon: '🥛', desc: '스팀 밀크 · 따뜻하게', w: 14 },
    { id: 4, name: '아이스 바닐라라떼', price: 5000, station: 'ESPRESSO', load: 2, fresh: 10, cat: 'coffee', icon: '🍦', desc: '마다가스카르 바닐라 빈 시럽', w: 12 },
    { id: 5, name: '딸기 스무디', price: 6000, station: 'BLENDER', load: 3, fresh: 10, cat: 'non', icon: '🍓', desc: '생딸기 듬뿍', w: 7 },
    { id: 6, name: '망고 요거트 스무디', price: 6300, station: 'BLENDER', load: 3, fresh: 10, cat: 'non', icon: '🥭', desc: '그릭 요거트 베이스', w: 5 },
    { id: 7, name: '핸드드립 에티오피아', price: 6500, station: 'BREW_BAR', load: 2, fresh: 10, cat: 'brew', icon: '🫖', desc: '예가체프 · 꽃향, 산미', w: 5 },
    { id: 8, name: '핸드드립 콜롬비아', price: 6500, station: 'BREW_BAR', load: 2, fresh: 10, cat: 'brew', icon: '🌰', desc: '수프리모 · 견과류, 초콜릿', w: 4 },
  ];
  const byId = Object.fromEntries(MENU.map((m) => [m.id, m]));
  const CATS = [['all', '전체'], ['coffee', '커피'], ['non', '논커피'], ['brew', '핸드드립']];
  const ACTIVE = new Set(['HELD', 'PAYING', 'PAID', 'READY', 'PICKED_UP']);
  const CARDS = [
    { id: 'ok', name: '국민카드', no: '**** 4821', note: '' },
    { id: 'declined', name: '신한카드', no: '**** 0917', note: '잔액 부족', red: true },
    { id: 'timeout', name: '하나카드', no: '**** 3310', note: '카드사 응답 지연' },
  ];
  const CAMPAIGN = { name: '성수역점 오픈 기념 쿠폰', discount: 1000, min: 5000, limit: 30 };
  // 같은 브랜드 근처 매장. 메뉴 · 가격은 같고 핸드드립은 팔지 않으며, 에스프레소 머신이 커서 용량이 더 크다.
  const STORES = {
    main: { name: '성수역점' },
    near: { name: '서울숲점', cap: { ESPRESSO: 8, BLENDER: 3, BREW_BAR: 0 }, notSold: new Set([7, 8]), walk: 0.5, walkMin: 6 },
  };
  const TRANSFER_DEADLINE = 120; // 서버 brewslot.order.transfer-accept-timeout 과 같은 2분
  const DELAY_ALERT_MIN = 5; // 서버 brewslot.order.delay-alert-minutes
  const NEAR_REPLIES = [
    { id: 'auto', name: '바로 수락', note: '자리가 있으면 즉시 (기본)' },
    { id: 'accept', name: '직원 확인', note: '20초 뒤 수락' },
    { id: 'refuse', name: '거절', note: '재료 소진 · 15초 뒤 거절' },
    { id: 'none', name: '응답 없음', note: '2분 기한 초과' },
  ];

  function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ───────────────────────── 상태 ─────────────────────────
  let st;
  let dirty = true;
  function freshState() {
    return {
      now: T(8, 10), genClock: T(8, 10), playing: true, speed: 10, rng: mulberry32(20260928),
      seq: 100, orders: [], cap: { ESPRESSO: 6, BLENDER: 3, BREW_BAR: 2 }, soldOut: new Set(), accepting: true, autoStaff: true,
      lost: 0, log: [],
      points: 3000, pointLog: [{ t: T(8, 0), amt: 3000, memo: '가입 축하 포인트' }],
      issued: 6, coupon: null, useCoupon: true,
      cart: [], pickSel: null, route: 'menu', cat: 'all', viewOrder: null, conflict: null, payCard: 'ok', usePoints: true, payOrder: null, payMsg: null, toast: null,
      storeTab: 'kds',
      xferOpen: null, xferPick: null, nearReply: 'auto', xferSeq: 0, showCodes: false, devTab: 'events', api: [],
    };
  }

  const earliest = () => Math.ceil(st.now / SLOT) * SLOT;
  const candidates = () => Array.from({ length: 12 }, (_, i) => earliest() + SLOT * (i + 1));

  const capOf = (store) => (store === 'main' ? st.cap : STORES[store].cap);
  function usage(store = 'main') {
    const m = new Map(); const cap = capOf(store);
    for (const o of st.orders) {
      if (o.store !== store || !ACTIVE.has(o.status)) continue;
      for (const tk of o.tickets) { const k = tk.station + '@' + tk.slot; m.set(k, (m.get(k) || 0) + tk.units); }
    }
    return { stateOf(station, slot) { const r = m.get(station + '@' + slot) || 0; return { capacity: Math.max(cap[station], r), reserved: r }; } };
  }
  /** 이 매장에서 이 장바구니를 팔지 않는 음료 (매장 변경 · 다른 매장 제안 판단. 서버 MenuEquivalence 와 같은 규칙) */
  const notSoldAt = (store, items) => (store === 'main' ? [] : items.filter((l) => STORES[store].notSold.has(l.menuId)).map((l) => byId[l.menuId].name));
  const demandsOf = (items) => items.map((l) => { const m = byId[l.menuId]; return { station: m.station, load: m.load * l.qty, fresh: m.fresh, line: l }; });

  // S.schedule 과 같은 순서 · 같은 규칙으로 각 주문 줄이 어느 슬롯에서 만들어지는지 기록 (제조 티켓용)
  function assignLines(pickup, ds, u, e) {
    const tent = new Map(); const out = [];
    for (const d of ds.slice().sort((a, b) => a.fresh - b.fresh || b.load - a.load)) {
      const key = (s) => d.station + '@' + s;
      const slot = S.productionSlots(pickup, d.fresh, e).find((s) => { const x = u.stateOf(d.station, s); return x.capacity - x.reserved - (tent.get(key(s)) || 0) >= d.load; });
      tent.set(key(slot), (tent.get(key(slot)) || 0) + d.load);
      out.push({ station: d.station, slot, line: d.line, units: d.load });
    }
    return out;
  }

  /** 제조 계획만 세운다(아무것도 잡지 않음). 성공하면 스테이션 · 슬롯별 제조 티켓 */
  function plan(store, items, pickup) {
    if (store === 'main' && !st.accepting) return { ok: false, reason: 'CLOSED', alts: [] };
    if (store === 'main' && items.some((l) => st.soldOut.has(l.menuId))) return { ok: false, reason: 'SOLD_OUT', alts: [] };
    if (notSoldAt(store, items).length) return { ok: false, reason: 'NOT_SOLD', alts: [] };
    const u = usage(store); const ds = demandsOf(items); const e = earliest();
    const r = S.schedule(pickup, ds, u, e);
    if (!r.feasible) return { ok: false, reason: r.reason, alts: S.nearestAlternatives(pickup, candidates(), ds, u, e) };
    const groups = new Map();
    for (const a of assignLines(pickup, ds, u, e)) {
      const k = a.station + '@' + a.slot;
      if (!groups.has(k)) groups.set(k, { station: a.station, slot: a.slot, units: 0, lines: [], done: false, doneAt: null });
      const g = groups.get(k); g.units += a.units; g.lines.push({ menuId: a.line.menuId, qty: a.line.qty });
    }
    return { ok: true, tickets: [...groups.values()].sort((a, b) => a.slot - b.slot) };
  }

  function tryPlace(items, pickup, mine, store = 'main') {
    const p = plan(store, items, pickup);
    if (!p.ok) return p;
    const tickets = p.tickets;
    const total = items.reduce((s, l) => s + byId[l.menuId].price * l.qty, 0);
    const o = {
      id: 'o' + (++st.seq), no: st.seq, mine, store, items: items.map((l) => ({ ...l })), pickup, tickets, total,
      status: mine ? 'HELD' : 'PAID', createdAt: st.now, holdUntil: mine ? st.now + HOLD_SEC : null,
      paidAt: mine ? null : st.now, readyAt: null, pickedAt: null, pickAt: null,
      pay: mine ? null : { card: total, points: 0, coupon: 0 },
      events: [],
    };
    if (mine) ev(o, 'OrderPlaced', `${STORES[store].name} 주문 접수 · ${hhmm(pickup)} 픽업 ${HOLD_SEC / 60}분간 예약`);
    st.orders.push(o);
    if (!mine && store === 'main') addLog(`#${o.no} 주문 접수 · ${hhmm(pickup)} 픽업 · ${itemsText(o.items)}`);
    return { ok: true, order: o };
  }

  const itemsText = (items) => items.map((l) => byId[l.menuId].name + (l.qty > 1 ? ' ×' + l.qty : '')).join(', ');
  const firstSlot = (o) => Math.min(...o.tickets.map((t) => t.slot));
  function addLog(msg) { st.log.unshift({ t: st.now, msg }); if (st.log.length > 80) st.log.pop(); }
  function ev(o, code, text) { o.events.push({ t: st.now, code, text }); }
  /** 고객 앱이 서버에 보내는 요청 기록 (개발자 보기 · API 탭). 경로 · 헤더 · 상태 코드는 docs/api/order-service.yaml 과 같다 */
  function api(method, path, status, req, res, note) { st.api.unshift({ t: st.now, method, path, status, req, res, note }); if (st.api.length > 60) st.api.pop(); }
  const oid = (o) => `ord-${o.no}`;
  const key = () => 'app-' + Math.random().toString(36).slice(2, 10);
  const remaining = () => CAMPAIGN.limit - st.issued;

  // ───────────────────────── 매장에 오는 다른 손님들 ─────────────────────────
  function rate(t) { const [h, m] = clockOf(t); const mm = h * 60 + m; if (mm >= 8 * 60 + 40 && mm < 9 * 60 + 30) return 1.4; if (mm >= 8 * 60 + 15 && mm < 10 * 60) return 0.7; return 0.35; }
  function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= st.rng(); } while (p > L); return k - 1; }
  function pickMenu() {
    const avail = MENU.filter((m) => !st.soldOut.has(m.id)); if (!avail.length) return null;
    let x = st.rng() * avail.reduce((s, m) => s + m.w, 0);
    for (const m of avail) { x -= m.w; if (x <= 0) return m; }
    return avail[avail.length - 1];
  }
  function walkIn() {
    if (!st.accepting) return;
    const n = 1 + (st.rng() < 0.3 ? 1 : 0) + (st.rng() < 0.08 ? 1 : 0); const items = [];
    for (let i = 0; i < n; i++) { const m = pickMenu(); if (!m) return; const ex = items.find((l) => l.menuId === m.id); if (ex) ex.qty++; else items.push({ menuId: m.id, qty: st.rng() < 0.1 ? 2 : 1 }); }
    const want = earliest() + SLOT * (1 + Math.floor(st.rng() * 5));
    let r = tryPlace(items, want, false);
    if (!r.ok && r.alts.length && st.rng() < 0.7) r = tryPlace(items, r.alts[0], false);
    if (!r.ok) { st.lost++; addLog(`${hhmm(want)} 픽업을 원한 손님 — 가능한 시간이 맞지 않아 주문하지 않음`); return; }
    // 이벤트 쿠폰을 받아 가는 손님들 (선착순 한도가 차면 더 발급되지 않는다)
    if (remaining() > 0 && st.rng() < 0.4) {
      st.issued++;
      if (remaining() === 0) addLog(`${CAMPAIGN.name} 선착순 ${CAMPAIGN.limit}장 모두 발급됨`);
      if (r.order.total >= CAMPAIGN.min) { r.order.pay.coupon = CAMPAIGN.discount; r.order.pay.card -= CAMPAIGN.discount; }
    }
  }
  /** 서울숲점에도 손님이 온다 (화면에는 안 보이지만 그 매장의 제조 자리를 차지한다) */
  function walkInNear() {
    const m = pickMenu(); if (!m || STORES.near.notSold.has(m.id)) return;
    const want = earliest() + SLOT * (1 + Math.floor(st.rng() * 5));
    tryPlace([{ menuId: m.id, qty: 1 }], want, false, 'near');
  }
  const procTime = (tk) => Math.min(270, 80 + tk.units * 30);

  function processAt(t) {
    const prevSlot = Math.floor(st.now / SLOT);
    st.now = t;
    let changed = Math.floor(t / SLOT) !== prevSlot;
    while (st.genClock + 60 <= t) {
      st.genClock += 60; const k = poisson(rate(st.genClock)); for (let i = 0; i < k; i++) walkIn(); if (k) changed = true;
      const kn = poisson(rate(st.genClock) * STORES.near.walk); for (let i = 0; i < kn; i++) walkInNear();
    }

  }
  function advance(sec) { const end = st.now + sec; while (st.now < end) processAt(Math.min(end, st.now + 10)); }

  // ───────────────────────── 고객 행동 ─────────────────────────
  const cartTotal = () => st.cart.reduce((s, l) => s + byId[l.menuId].price * l.qty, 0);
  const cartCount = () => st.cart.reduce((s, l) => s + l.qty, 0);
  function addToCart(id, d) {
    const ex = st.cart.find((l) => l.menuId === id);
    if (ex) { ex.qty = Math.max(0, Math.min(5, ex.qty + d)); if (!ex.qty) st.cart = st.cart.filter((l) => l !== ex); }
    else if (d > 0) st.cart.push({ menuId: id, qty: 1 });

  }
  function placeMine(store = 'main') {
    if (!st.pickSel) return;

    if (!r.ok) {

      const nearOk = store === 'main' && plan('near', st.cart, st.pickSel).ok;
      api('POST', '/orders', 409, { 'Idempotency-Key': key(), ...body }, { type: 'pickup-slot-unavailable', reason: r.reason, alternatives: r.alts.map(hhmm), nearbyStores: nearOk ? [{ storeName: '서울숲점', pickupAt: hhmm(st.pickSel), walkMinutes: STORES.near.walkMin }] : [] }, '용량 부족 → 가장 가까운 시각 3개 + 같은 시각 가능한 근처 매장');

  /** 결제 화면에서 적용될 금액: 쿠폰 → 포인트 → 나머지 카드 (서버 Order.cardAmount 와 같은 순서) */
  function amountsFor(o) {

    const coupon = couponOk && st.useCoupon ? c.discount : 0;

  function claimCoupon() {

  // ───────────────────────── 지연 감지 (서버 PickupRiskDetector 와 같은 규칙) ─────────────────────────
  /** 성수역점 지연(분): 준비됐어야 할(계획한 마지막 제조 슬롯이 끝난) 주문 중 아직 안 나온 것의 가장 오래 밀린 시간 */

      st.toast = { text: `#${o.no} 서울숲점으로 옮겨졌어요. ${hhmm(o.pickup)}에 서울숲점에서 받아가세요.`, id: o.id };
      addLog(`#${o.no} 서울숲점으로 매장 변경 완료 → 이 매장 제조 자리 반환, 매출은 서울숲점 정산으로`);
    } else if (t >= x.replyAt && x.reply === 'refuse') {
      failTransfer(o, 'REFUSED', 'OrderTransferFailed', '서울숲점 거절 (재료 소진) → 서울숲점 자리 해제, 성수역점 주문 유지',
        `#${o.no} 서울숲점이 주문을 받지 못했어요. 성수역점 주문은 그대로예요.`);
    } else if (t >= x.deadline) {
      failTransfer(o, 'EXPIRED', 'OrderTransferFailed', '서울숲점 2분 동안 응답 없음 → 요청 만료, 성수역점 주문 유지',
        `#${o.no} 서울숲점 응답이 없어 변경을 취소했어요. 성수역점 주문은 그대로예요.`);
    }
  }

  // ───────────────────────── 고객 앱 화면 ─────────────────────────
  const STATUS_PILL = {
    HELD: ['acc', '결제 대기'], PAYING: ['warn', '결제 확인 중'], PAID: ['acc', '접수됨'], READY: ['good', '픽업 대기'], PICKED_UP: ['', '픽업 완료'],
    CANCELLED: ['', '취소됨'], EXPIRED: ['', '시간 만료'], FAILED: ['bad', '결제 실패'],
  };
  const orderStage = (o) => (o.status === 'PAID' ? (st.now >= firstSlot(o) ? 'MAKING' : 'WAIT') : o.status);
  function promoBanner() {
    const c = st.coupon;
    if (c && c.status === 'ISSUED') return `<div class="promo"><span class="ic">🎟️</span><div class="tx"><b>${won(c.discount)} 할인 쿠폰 보유</b>${won(c.min)} 이상 주문하면 결제할 때 자동으로 적용돼요</div></div>`;
    if (c) return '';
    if (remaining() <= 0) return `<div class="promo" style="opacity:.6"><span class="ic">🎉</span><div class="tx"><b>${CAMPAIGN.name}</b>선착순 ${CAMPAIGN.limit}장이 모두 소진됐어요</div></div>`;
    return `<div class="promo"><span class="ic">🎉</span><div class="tx"><b>${CAMPAIGN.name} ${won(CAMPAIGN.discount)}</b>선착순 ${CAMPAIGN.limit}명 · <span class="num">남은 ${remaining()}장</span> · ${won(CAMPAIGN.min)} 이상</div><button data-act="claim">쿠폰 받기</button></div>`;
  }
  const until = (t) => `<span class="num" data-until="${t}"></span>`;
  const fmtLeft = (sec) => (sec <= 0 ? '0:00' : Math.floor(sec / 60) + ':' + pad(Math.floor(sec % 60)));
  function slotLevel(pickup, u) { const p = S.loadPercentBefore(pickup, u); return p < 50 ? ['lv-ok', '여유'] : p < 85 ? ['lv-mid', '보통'] : ['lv-busy', '혼잡']; }

  /** 주문 상세의 매장 변경 영역: 후보 선택 → 수락 대기 → 결과 */
  function transferHtml(o) {
    const x = o.transfer;
    const r = o.risk;
    if (r && !r.dismissed && transferable(o) && st.xferOpen !== o.id) {
      return `<div class="banner warn" role="alert" style="margin-top:12px"><b>성수역점이 약 ${r.delay}분 늦어지고 있어요</b>
        <div style="font-size:13px;margin-top:4px">지금 기다리면 <b class="num">${hhmm(r.readyAt)}</b>쯤 준비돼요.${r.sug ? ` 같은 브랜드 <b>서울숲점</b>(도보 ${STORES.near.walkMin}분)에서는 <b class="num">${hhmm(r.sug)}</b>에 받을 수 있어요. 결제 · 쿠폰 · 포인트는 그대로예요.` : ' 근처에 같은 음료를 만들 수 있는 매장이 없어요.'}</div>
        <div style="display:flex;gap:8px;margin-top:10px">${r.sug ? `<button class="primary" data-act="riskGo" data-id="${o.id}" style="flex:2"><span>서울숲점에서 ${hhmm(r.sug)}에 받기</span><span>›</span></button>` : ''}<button class="secondary" data-act="riskStay" data-id="${o.id}" style="flex:1">그냥 기다릴게요</button></div></div>`;
    }
    if (x && x.status === 'AWAITING') {
      return `<div class="banner warn" role="status" style="margin-top:12px"><span class="spin"></span> <b>서울숲점 수락을 기다리고 있어요</b> · <span class="num" data-until="${x.deadline}"></span> 안에 답이 없으면 자동 취소
        <div style="font-size:12px;margin-top:6px">서울숲점 ${hhmm(x.pickup)} 자리는 먼저 잡아뒀고, 그동안 성수역점 주문도 그대로 유지돼요. 성수역점이 먼저 만들기 시작하면 변경은 취소돼요.</div>
        <button class="secondary" data-act="xferRetry" data-id="${o.id}" style="margin-top:8px">요청이 안 된 것 같아요 · 다시 요청</button>${x.retries ? `<div style="font-size:12px;margin-top:6px">같은 요청으로 확인했어요 (재요청 ${x.retries}회). 두 번 옮겨지지 않아요.</div>` : ''}</div>`;
    }
    if (x && x.status === 'COMPLETED') return `<div class="banner good" style="margin-top:12px;background:var(--good-soft);color:var(--good)">📍 성수역점 → <b>서울숲점</b>으로 옮겼어요. 결제 · 쿠폰 · 포인트는 그대로예요.</div>`;
    if (x && x.status !== 'COMPLETED' && st.xferOpen !== o.id) {
      const why = { REFUSED: '서울숲점이 주문을 받지 못했어요', EXPIRED: '서울숲점 응답이 없었어요', ABORTED: '성수역점이 먼저 만들기 시작했어요' }[x.status];
      return `<div class="banner" style="margin-top:12px">매장 변경 안 됨 · ${why}. <b>성수역점 주문은 그대로</b>예요.</div>`;
    }
    if (st.xferOpen !== o.id || !transferable(o)) return '';
    const miss = notSoldAt('near', o.items);
    let h = `<div class="section-h">픽업 매장 바꾸기 <small>같은 브랜드 · 같은 가격 메뉴만</small></div>`;
    if (miss.length) return h + `<div class="banner warn">서울숲점에는 ${miss.join(' · ')} 메뉴가 없어 옮길 수 없어요.</div><button class="secondary" data-act="xferClose">닫기</button>`;
    const u = usage('near'); const ds = demandsOf(o.items); const e = earliest();
    const same = S.schedule(o.pickup, ds, u, e).feasible;
    const times = (same ? [o.pickup] : []).concat(S.nearestAlternatives(o.pickup, candidates(), ds, u, e)).slice(0, 4);
    if (!st.xferPick || !times.includes(st.xferPick)) st.xferPick = times[0] || null;
    h += `<div class="kv"><span><b>서울숲점</b> <span class="m">성수역점에서 도보 ${STORES.near.walkMin}분</span></span><span class="pill ${same ? 'good' : 'warn'}">${same ? `${hhmm(o.pickup)} 그대로 가능` : '다른 시각만 가능'}</span></div>`;
    h += times.length ? `<div class="slots" style="margin-top:8px">${times.map((t) => `<button class="slot num" data-xpick="${t}" aria-pressed="${st.xferPick === t}"><b>${hhmm(t)}</b><span>${t === o.pickup ? '지금 약속' : t < o.pickup ? '더 일찍' : '조금 늦게'}</span></button>`).join('')}</div>`
      : `<div class="banner warn">서울숲점도 한 시간 안에 가능한 시간이 없어요.</div>`;
    h += `<div class="section-h" style="margin-top:12px">데모 설정 · 서울숲점 응답</div><div class="chips">${NEAR_REPLIES.map((r) => `<button class="chip" data-reply="${r.id}" aria-pressed="${st.nearReply === r.id}" title="${r.note}">${r.name}</button>`).join('')}</div>`;
    h += `<div style="display:flex;gap:8px;margin-top:10px"><button class="secondary" data-act="xferClose" style="flex:1">닫기</button><button class="primary" data-act="xferGo" data-id="${o.id}" style="flex:2" ${st.xferPick ? '' : 'disabled'}><span>${st.xferPick ? `서울숲점 ${hhmm(st.xferPick)} 요청` : '시각 선택'}</span><span>›</span></button></div>`;
    return h;
  }

  function renderPhone() {
    const r = st.route;
    const back = (to) => `<button class="back" data-go="${to}" aria-label="뒤로">‹</button>`;
    const ptsPill = `<span class="pts num">${st.points.toLocaleString()}P</span>`;
    let h = '', b = '';
    if (r === 'menu') {
      h = `<div><h2>BrewSlot 성수역점</h2><div class="sub">${st.accepting ? '영업 중 · 받을 시각에 맞춰 만들어 드려요' : '지금은 주문을 받지 않아요'}</div></div>${ptsPill}`;
      if (!st.accepting) b += `<div class="banner warn">매장 사정으로 잠시 주문 접수를 멈췄어요.</div>`;
      b += promoBanner();
      b += `<div class="chips" role="group" aria-label="분류">${CATS.map(([k, n]) => `<button class="chip" data-cat="${k}" aria-pressed="${st.cat === k}">${n}</button>`).join('')}</div>`;
      b += `<ul class="menu-list">${MENU.filter((m) => st.cat === 'all' || m.cat === st.cat).map((m) => {
        const inCart = st.cart.find((l) => l.menuId === m.id); const out = st.soldOut.has(m.id);
        const ctl = out ? '<span class="pill">품절</span>'
          : inCart ? `<div class="stepper"><button data-cart="${m.id}" data-d="-1" aria-label="빼기">−</button><span class="num">${inCart.qty}</span><button data-cart="${m.id}" data-d="1" aria-label="더하기">+</button></div>`
          : `<button class="add" data-cart="${m.id}" data-d="1">담기</button>`;
        return `<li class="menu-item${out ? ' out' : ''}"><div class="thumb">${m.icon}</div><div class="grow"><div class="nm">${m.name}</div><div class="desc">${m.desc}</div><div class="pr num">${won(m.price)}</div></div>${ctl}</li>`;
      }).join('')}</ul>`;
      if (cartCount()) b += `<div class="cartbar"><button class="primary" data-go="checkout"><span>${cartCount()}잔 · 받을 시간 고르기</span><span class="num">${won(cartTotal())}</span></button></div>`;
    } else if (r === 'checkout') {
      h = `${back('menu')}<h2>주문 확인</h2>${ptsPill}`;
      if (!st.cart.length) b = `<div class="empty">장바구니가 비었어요.<br><br><button class="secondary" data-go="menu" style="width:auto">메뉴 보러 가기</button></div>`;
      else {
        b += st.cart.map((l) => { const m = byId[l.menuId]; return `<div class="line-row"><div class="thumb" style="width:40px;height:40px;font-size:18px">${m.icon}</div><div class="grow"><b>${m.name}</b><div class="num" style="color:var(--muted);font-size:12px">${won(m.price * l.qty)}</div></div><div class="stepper"><button data-cart="${m.id}" data-d="-1" aria-label="빼기">−</button><span class="num">${l.qty}</span><button data-cart="${m.id}" data-d="1" aria-label="더하기">+</button></div></div>`; }).join('');
        const u = usage(); const ds = demandsOf(st.cart); const e = earliest();
        const blocked = !st.accepting || st.cart.some((l) => st.soldOut.has(l.menuId));
        const cands = candidates().map((t) => ({ t, ok: !blocked && S.schedule(t, ds, u, e).feasible }));
        if (st.pickSel && !cands.find((c) => c.t === st.pickSel && c.ok)) st.pickSel = null;
        if (st.conflict) {
          const c = st.conflict;
          const why = c.reason === 'EXCEEDS_SLOT_CAPACITY' ? '한 번에 만들 수 있는 양보다 많아요. 수량을 나눠서 주문해 주세요.'
            : c.reason === 'CLOSED' ? '지금은 주문을 받지 않아요.' : c.reason === 'SOLD_OUT' ? '품절된 메뉴가 있어요.'
            : `그 사이 주문이 몰려 ${hhmm(c.pickup)} 픽업은 마감됐어요.${c.alts.length ? ' 이 시간은 가능해요:' : ''}`;
          b += `<div class="banner bad" role="alert" style="margin-top:12px">${why}${c.alts.length ? `<div style="margin-top:8px" class="chips">${c.alts.map((t) => `<button class="chip" data-alt="${t}">${hhmm(t)}로 주문</button>`).join('')}</div>` : ''}${c.near ? `<div style="margin-top:10px;padding-top:10px;border-top:1px dashed currentColor">같은 브랜드 <b>서울숲점</b>은 ${hhmm(c.near)} 그대로 가능해요 (성수역점에서 도보 ${STORES.near.walkMin}분).<div style="margin-top:8px" class="chips"><button class="chip" data-near="${c.near}">서울숲점에서 ${hhmm(c.near)}에 받기</button></div></div>` : ''}</div>`;
        }
        if (blocked) b += `<div class="banner warn" style="margin-top:12px">${st.accepting ? '품절된 메뉴를 빼 주세요.' : '매장 사정으로 잠시 주문 접수를 멈췄어요.'}</div>`;
        b += `<div class="section-h">언제 받으시겠어요? <small>고른 시각에 맞춰 만들기 시작해요</small></div>`;
        b += `<div class="slots">${cands.map((c) => { const [cls, lv] = c.ok ? slotLevel(c.t, u) : ['', '마감']; return `<button class="slot num" data-pick="${c.t}" ${c.ok ? '' : 'disabled'} aria-pressed="${st.pickSel === c.t}"><b>${hhmm(c.t)}</b><span class="${cls}">${lv}</span></button>`; }).join('')}</div>`;
        if (!blocked && !cands.some((c) => c.ok)) b += `<div class="banner warn" style="margin-top:10px">한 시간 안에 받을 수 있는 시간이 없어요. 수량을 줄여 보세요.</div>`;
        b += `<div style="margin-top:14px"><div class="kv total"><span>합계</span><span class="num">${won(cartTotal())}</span></div></div>`;
        b += `<div class="cartbar"><button class="primary" data-act="place" ${st.pickSel ? '' : 'disabled'}><span>${st.pickSel ? hhmm(st.pickSel) + '에 받기' : '받을 시간을 골라주세요'}</span><span class="num">${won(cartTotal())}</span></button></div>`;
      }
    } else if (r === 'pay') {
      const o = st.orders.find((x) => x.id === st.payOrder);
      if (!o) { st.route = 'menu'; return renderPhone(); }
      h = `<h2>결제</h2>${ptsPill}`;
      if (st.payMsg) {
        b += `<div class="banner ${st.payMsg.kind}" role="alert">${st.payMsg.text}</div><button class="primary" data-act="retry"><span>다시 주문하기</span><span>›</span></button>`;
      } else {
        const a = amountsFor(o); const pts = a.points;
        b += `<div class="hold"><div class="cd num" data-hold="${o.holdUntil}">${fmtLeft(o.holdUntil - st.now)}</div><div class="t">${hhmm(o.pickup)} 픽업을 예약해 뒀어요. 시간 안에 결제해 주세요.</div></div>`;
        b += o.items.map((l) => `<div class="kv"><span>${byId[l.menuId].name} × ${l.qty}</span><span class="num">${won(byId[l.menuId].price * l.qty)}</span></div>`).join('');
        if (st.coupon && st.coupon.status === 'ISSUED') {
          b += `<div class="section-h">쿠폰</div><button class="toggle" data-act="coupon" role="switch" aria-checked="${a.couponOk && st.useCoupon}" ${a.couponOk ? '' : 'disabled'}><span>🎟️ ${won(st.coupon.discount)} 할인${a.couponOk ? '' : `<div style="font-size:12px;color:var(--muted)">${won(st.coupon.min)} 이상 주문 시 사용 가능</div>`}</span><span class="sw"></span></button>`;
        }
        b += `<div class="section-h">포인트</div><button class="toggle" data-act="points" role="switch" aria-checked="${st.usePoints}"><span>보유 <b class="num">${st.points.toLocaleString()}P</b> 사용</span><span class="sw"></span></button>`;
        b += `<div class="section-h">결제 카드</div>${CARDS.map((c) => `<button class="card-opt" data-card="${c.id}" aria-pressed="${st.payCard === c.id}"><span class="cc${c.red ? ' red' : ''}"></span><span><b>${c.name}</b> <span class="num">${c.no}</span>${c.note ? `<div style="font-size:12px;color:var(--muted)">${c.note}</div>` : ''}</span></button>`).join('')}`;
        b += `<div style="margin-top:10px"><div class="kv"><span class="m">주문 금액</span><span class="num">${won(o.total)}</span></div>${a.coupon ? `<div class="kv"><span class="m">쿠폰 할인</span><span class="num">−${won(a.coupon)}</span></div>` : ''}<div class="kv"><span class="m">포인트 사용</span><span class="num">−${won(pts)}</span></div><div class="kv total"><span>카드 결제</span><span class="num">${won(a.card)}</span></div></div>`;
        b += `<button class="secondary" data-act="cancelHold" style="margin-top:14px">주문 취소</button>`;
        b += `<div class="cartbar"><button class="primary" data-act="pay"><span>결제하기</span><span class="num">${won(a.card)}</span></button></div>`;
      }
    } else if (r === 'order') {
      const o = st.orders.find((x) => x.id === st.viewOrder);
      h = `${back('orders')}<h2>주문 상세</h2>${ptsPill}`;
      const stg = orderStage(o); const fs = firstSlot(o);
      const msg = {
        PAYING: ['결제 결과를 확인하고 있어요', '카드사 응답이 늦어요. 자동으로 다시 확인하니 기다려 주세요'],
        WAIT: [o.risk && o.store === 'main' ? `${STORES.main.name}이 밀려 ${hhmm(o.risk.readyAt)}쯤 준비될 것 같아요` : `${STORES[o.store].name}에서 ${hhmm(o.pickup)}에 받으실 수 있어요`, `음료가 식지 않도록 ${hhmm(fs)}부터 만들어요 · ${until(fs)} 남음`],
        MAKING: ['만들고 있어요', `${hhmm(o.pickup)}까지 준비해 드릴게요`],
        READY: [`준비됐어요! ${STORES[o.store].name} 픽업대에서 받아가세요`, o.readyAt <= o.pickup ? `약속한 ${hhmm(o.pickup)}보다 먼저 준비됐어요` : '약속 시각보다 늦어져 죄송해요'],
        PICKED_UP: ['맛있게 드세요', `${hhmm(o.pickedAt)} 픽업`],
        CANCELLED: ['주문이 취소됐어요', '카드 승인 취소와 포인트 환불이 끝났어요'],
      }[stg];
      const promise = ['PAYING', 'WAIT', 'MAKING'].includes(stg)
        ? `<div class="promise"><span class="big num">픽업 약속 ${hhmm(o.pickup)}</span><span class="num">${o.risk && o.store === 'main' ? `예상 ${hhmm(o.risk.readyAt)} · 약 ${o.risk.delay}분 지연` : `${until(o.pickup)} 남음`}</span></div>` : '';
      b += `<div class="bignum"><span class="pill acc">주문번호</span><div class="no num">#${o.no}</div><div class="msg">${stg === 'PAYING' ? '<span class="spin"></span> ' : ''}${msg[0]}</div><div class="msg2">${msg[1]}</div>${promise}</div>`;
      if (stg === 'PAYING') b += `<button class="secondary" data-act="retryPay" data-id="${o.id}" style="margin:6px 0 4px">결제가 안 된 것 같아요 · 다시 요청</button>${o.retries ? `<div class="banner good" style="margin-top:8px;background:var(--good-soft);color:var(--good)">같은 결제로 확인했어요. 다시 눌러도 두 번 결제되지 않아요 (재요청 ${o.retries}회).</div>` : ''}`;
      if (stg !== 'CANCELLED' && stg !== 'PAYING') {
        const steps = [
          ['결제 완료', hhmm(o.paidAt), true],
          ['제조 시작', st.now >= fs ? hhmm(fs) : hhmm(fs) + ' 예정', st.now >= fs],
          ['준비 완료', o.readyAt ? hhmm(o.readyAt) : hhmm(o.pickup) + ' 전까지', !!o.readyAt],

      h += `<p class="hint" style="margin:-6px 0 12px">포인트·쿠폰 할인분은 브랜드가 부담해 정가 기준으로 정산돼요. ${CAMPAIGN.name}: ${st.issued}/${CAMPAIGN.limit}장 발급, ${valid.filter((o) => o.pay.coupon).length}장 사용.${refunds ? ` 취소 ${won(refunds)}은 매출에서 빠졌어요.` : ''}${moved.length ? ` 서울숲점으로 옮긴 ${moved.length}건 ${won(moved.reduce((a, o) => a + o.total, 0))}은 카드 수수료와 함께 서울숲점 정산으로 넘어갔어요.` : ''}</p>`;
      h += `<div class="tbl-wrap" style="max-height:420px"><table><thead><tr><th>주문</th><th>결제</th><th>픽업</th><th>메뉴</th><th class="r">금액</th><th class="r">카드</th><th class="r">포인트</th><th class="r">쿠폰</th><th class="r">수수료</th><th>상태</th></tr></thead><tbody>`;
      h += list.slice().reverse().map((o) => { const [c, t] = o.movedFrom ? ['', '→ 서울숲점'] : STATUS_PILL[o.status]; const x = o.status === 'CANCELLED' || !!o.movedFrom; return `<tr${x ? ' style="color:var(--muted)"' : ''}><td class="num"><b>#${o.no}</b>${o.mine ? ' <span class="pill acc">내 주문</span>' : ''}</td><td class="num">${hhmm(o.paidAt)}</td><td class="num">${hhmm(o.pickup)}</td><td>${itemsText(o.items)}</td><td class="r num">${won(o.total)}</td><td class="r num">${won(o.pay.card)}</td><td class="r num">${won(o.pay.points)}</td><td class="r num">${won(o.pay.coupon || 0)}</td><td class="r num">${x ? '0원' : won(fee(o))}</td><td><span class="pill ${c}">${t}</span></td></tr>`; }).join('');
      h += `</tbody></table></div>`;
    }
    const body = $('conBody');
    const scrolls = [...body.querySelectorAll('.tbl-wrap, .log')].map((el) => el.scrollTop);
    body.innerHTML = h;
    body.querySelectorAll('.tbl-wrap, .log').forEach((el, i) => { if (scrolls[i]) el.scrollTop = scrolls[i]; });
  }
  $('storeTabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) { st.storeTab = b.dataset.tab; renderStore(); } });
  $('conBody').addEventListener('click', (e) => {
    const el = e.target.closest('button'); if (!el) return; const d = el.dataset;
    if (d.sact === 'auto') st.autoStaff = !st.autoStaff;
    else if (d.sact === 'accept') { st.accepting = !st.accepting; addLog(st.accepting ? '주문 접수 재개' : '주문 접수 일시 중지'); }
    else if (d.cap) { st.cap[d.cap] = Math.max(0, Math.min(12, st.cap[d.cap] + Number(d.d))); addLog(`${STATION[d.cap].name} 5분당 용량 ${st.cap[d.cap]}로 변경`); }
    else if (d.sold) { const id = Number(d.sold); if (st.soldOut.has(id)) st.soldOut.delete(id); else st.soldOut.add(id); addLog(`${byId[id].name} ${st.soldOut.has(id) ? '품절 처리' : '판매 재개'}`); }
    else if (d.done) {
      const [id, sta, slot] = d.done.split('|'); const o = st.orders.find((x) => x.id === id);
      const tk = o && o.tickets.find((t) => t.station === sta && t.slot === Number(slot));
      if (tk && !tk.done) { tk.done = true; tk.doneAt = st.now; processAt(st.now); }
    }
    else if (d.hand) { const o = st.orders.find((x) => x.id === d.hand); if (o.mine) pickupMine(o); else if (o.status === 'READY') { o.status = 'PICKED_UP'; o.pickedAt = st.now; } }
    else return;
    renderAll();
  });

  // ───────────────────────── 시계 · 루프 ─────────────────────────
  // ───────────────────────── 개발자 보기: 백엔드에서 실제로 일어나는 일 ─────────────────────────
  const GH = 'https://github.com/sokldjs554/brewslot/blob/main/services/';
  const EVENT_META = {
    OrderPlaced: ['order.events', 'order-service', '조회 모델(CQRS)', 'order-service/src/main/kotlin/com/brewslot/order/ordering/application/PlaceOrderService.kt'],
    PaymentRequested: ['payment.commands · loyalty.commands', 'order-service (Saga)', 'payment · loyalty', 'order-service/src/main/kotlin/com/brewslot/order/ordering/saga/CheckoutSagaOrchestrator.kt'],
    PointsRedeemed: ['loyalty.events', 'loyalty-service', 'order Saga · settlement', 'loyalty-service/src/main/kotlin/com/brewslot/loyalty/application/PointService.kt'],
    PaymentCaptured: ['payment.events', 'payment-service', 'order Saga · settlement', 'payment-service/src/main/kotlin/com/brewslot/payment/application/PaymentService.kt'],
    PaymentFailed: ['payment.events', 'payment-service', 'order Saga', 'payment-service/src/main/kotlin/com/brewslot/payment/application/PaymentService.kt'],
    PaymentUnknown: ['(payment-service 내부)', 'payment-service', 'PG 결과 재조회 잡', 'payment-service/src/main/kotlin/com/brewslot/payment/application/PaymentService.kt'],
    PointsRedemptionReversed: ['loyalty.events', 'loyalty-service', 'settlement', 'loyalty-service/src/main/kotlin/com/brewslot/loyalty/application/PointService.kt'],
    OrderPaid: ['order.events', 'order-service', '알림(SSE) · 조회 모델', 'order-service/src/main/kotlin/com/brewslot/order/ordering/saga/CheckoutSagaOrchestrator.kt'],
    OrderCancelled: ['order.events', 'order-service', '알림 · 조회 모델', 'order-service/src/main/kotlin/com/brewslot/order/ordering/application/OrderLifecycleService.kt'],
    OrderReady: ['order.events', 'order-service', '알림(SSE) · 조회 모델', 'order-service/src/main/kotlin/com/brewslot/order/ordering/application/OrderLifecycleService.kt'],
    OrderPickedUp: ['order.events', 'order-service', 'loyalty(적립) · 조회 모델', 'order-service/src/main/kotlin/com/brewslot/order/ordering/application/OrderLifecycleService.kt'],
    PointsEarned: ['(loyalty-service 내부)', 'loyalty-service', '복식부기 원장', 'loyalty-service/src/main/kotlin/com/brewslot/loyalty/application/PointService.kt'],
    PickupAtRisk: ['order.events', 'order-service (지연 감지 잡)', '알림(SSE)', 'order-service/src/main/kotlin/com/brewslot/order/ordering/application/PickupRiskDetector.kt'],
    TransferRequested: ['(HTTP · store_transfer 테이블)', 'order-service', '새 매장 슬롯 HELD', 'order-service/src/main/kotlin/com/brewslot/order/ordering/application/StoreTransferService.kt'],
    OrderTransferred: ['order.events', 'order-service', 'settlement · loyalty · 알림', 'order-service/src/main/kotlin/com/brewslot/order/ordering/application/StoreTransferService.kt'],
    OrderTransferFailed: ['order.events', 'order-service', '알림(SSE)', 'order-service/src/main/kotlin/com/brewslot/order/ordering/application/StoreTransferService.kt'],
  };
  const DEV_TABS = [['events', '이벤트'], ['api', 'API'], ['slots', '제조 슬롯'], ['money', '돈의 흐름']];
  const esc = (x) => String(x).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const jsonLine = (o) => esc(JSON.stringify(o));
  const latestMine = () => st.orders.filter((o) => o.mine && o.pay).slice(-1)[0] || st.orders.filter((o) => o.mine).slice(-1)[0];

  function devEvents() {
    const evs = st.orders.filter((o) => o.mine).flatMap((o) => o.events.map((e) => ({ ...e, no: o.no }))).sort((a, b) => b.t - a.t).slice(0, 40);
    if (!evs.length) return `<div class="empty2">주문 · 결제하면 <code>OrderPlaced</code> → <code>PaymentRequested</code> → <code>PaymentCaptured</code> → <code>OrderPaid</code> 가 쌓여요. 매장 화면에서 '바리스타 자동 처리'를 끄면 <code>PickupAtRisk</code> → <code>OrderTransferred</code> 도 볼 수 있어요.</div>`;
    return `<ul>${evs.map((e) => { const m = EVENT_META[e.code] || ['', '', '', '']; return `<li><span class="t num">${hhmmss(e.t)}</span><b>#${e.no}</b> <code>${e.code}</code>${e.text}
      <div class="meta">${m[0] ? `<span class="topic">${m[0]}</span> ${m[1]} → ${m[2]}` : ''}${m[3] ? ` · <a href="${GH}${m[3]}" target="_blank" rel="noopener">코드</a>` : ''}</div></li>`; }).join('')}</ul>`;
  }
  function devApi() {
    if (!st.api.length) return `<div class="empty2">고객 앱에서 누르는 버튼마다 서버로 가는 요청이 여기 찍혀요. 주문 생성 · 결제 · 매장 변경 요청에는 <code>Idempotency-Key</code> 가 붙어 두 번 눌러도 한 번만 처리돼요.</div>`;
    return `<ul>${st.api.map((a) => `<li><span class="t num">${hhmmss(a.t)}</span><b class="m-${a.method}">${a.method}</b> ${esc(a.path)} <span class="st s${String(a.status)[0]}">${a.status}</span>
      <div class="meta">${esc(a.note)}</div><pre>→ ${jsonLine(a.req)}\n← ${jsonLine(a.res)}</pre></li>`).join('')}</ul>`;
  }
  function devSlots() {
    const o = latestMine();
    if (!o || !o.tickets) return `<div class="empty2">주문하면 픽업 시각에서 거꾸로(신선도 창 안에서 가장 늦은 슬롯부터) 어느 스테이션 · 몇 시 슬롯에 만들지 여기 보여요.</div>`;
    const u = usage(o.store);
    const rows = o.tickets.map((tk) => { const x = u.stateOf(tk.station, tk.slot); return `<tr><td>${STATION[tk.station].name}</td><td class="num">${hhmm(tk.slot)}~${hhmm(tk.slot + SLOT)}</td><td class="num">${tk.units}</td><td class="num">${x.reserved}/${x.capacity}</td><td>${tk.lines.map((l) => byId[l.menuId].name + (l.qty > 1 ? '×' + l.qty : '')).join(', ')}</td></tr>`; }).join('');
    const fresh = o.items.map((l) => `${byId[l.menuId].name} ${byId[l.menuId].fresh}분`).join(' · ');
    return `<div class="dev-note">#${o.no} · ${STORES[o.store].name} · 픽업 <b>${hhmm(o.pickup)}</b> · 신선도 창: ${fresh}<br>음료가 식지 않도록 픽업 직전 슬롯부터 거꾸로 채워요. 칸이 가득 차면 409 + 가까운 시각 3개.</div>
      <table class="dev-tbl"><thead><tr><th>스테이션</th><th>제조 슬롯</th><th>부하</th><th>슬롯 사용</th><th>음료</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="dev-note">DB: <code>slot_capacity (reserved ≤ capacity CHECK)</code> 행을 <code>ORDER BY station, slot_start FOR UPDATE</code> 로 잠가 동시 주문에도 초과 예약 0 · <a href="${GH}order-service/src/main/kotlin/com/brewslot/order/scheduling/domain/BrewScheduler.kt" target="_blank" rel="noopener">스케줄러 코드</a></div>`;
  }
  function devMoney() {
    const o = st.orders.filter((x) => x.mine && x.pay && x.paidAt).slice(-1)[0];
    if (!o) return `<div class="empty2">결제하면 쿠폰 · 포인트 · 카드가 복식부기 원장과 정산 원천 행으로 어떻게 기록되는지 여기 보여요.</div>`;
    const from = STORES.main.name, cur = STORES[o.store].name, fee = (n) => Math.round(n * 0.022);
    const led = []; const stl = [];
    if (o.pay.coupon) { led.push(['쿠폰 사용', 'brand:1:promotion', `store:${from}:clearing`, o.pay.coupon]); stl.push(['COUPON_SALE', from, o.pay.coupon, 0]); }
    if (o.pay.points) { led.push(['포인트 사용', 'member:1:brand:1', `store:${from}:clearing`, o.pay.points]); stl.push(['POINT_SALE', from, o.pay.points, 0]); }
    if (o.pay.card) stl.push(['CARD_SALE', from, o.pay.card, fee(o.pay.card)]);
    if (o.movedFrom) {
      if (o.pay.coupon + o.pay.points) led.push(['매장 변경', `store:${from}:clearing`, `store:${cur}:clearing`, o.pay.coupon + o.pay.points]);
      stl.push(['TRANSFER_OUT', from, -o.total, -fee(o.pay.card)]); stl.push(['TRANSFER_IN', cur, o.total, fee(o.pay.card)]);
    }
    if (o.status === 'CANCELLED') {
      if (o.pay.points) led.push(['사용 취소', `store:${cur}:clearing`, 'member:1:brand:1', o.pay.points]);
      if (o.pay.coupon) led.push(['쿠폰 복원', `store:${cur}:clearing`, 'brand:1:promotion', o.pay.coupon]);
      if (o.pay.card) stl.push(['CARD_REFUND', cur, -o.pay.card, -fee(o.pay.card)]);
      if (o.pay.points) stl.push(['POINT_REVERSAL', cur, -o.pay.points, 0]);
      if (o.pay.coupon) stl.push(['COUPON_REVERSAL', cur, -o.pay.coupon, 0]);
    }
    const earn = o.status === 'PICKED_UP' ? Math.floor((o.pay.card * 0.03) / 10) * 10 : 0;
    if (earn) led.push(['적립 3%', 'brand:1:funding', 'member:1:brand:1', earn]);
    const byStore = {}; stl.forEach(([, st2, amt, f]) => { byStore[st2] = byStore[st2] || [0, 0]; byStore[st2][0] += amt; byStore[st2][1] += f; });
    return `<div class="dev-note">#${o.no} · 총액 ${won(o.total)} = 쿠폰 ${won(o.pay.coupon)} + 포인트 ${won(o.pay.points)} + 카드 ${won(o.pay.card)}${o.movedFrom ? ` · ${from} → ${cur} 매장 변경` : ''}${o.status === 'CANCELLED' ? ' · 취소됨' : ''}</div>
      <div class="dev-h">포인트 원장 (loyalty-service · 차변 = 대변을 DB 트리거가 강제)</div>
      <table class="dev-tbl"><thead><tr><th>거래</th><th>차변</th><th>대변</th><th class="r">금액</th></tr></thead><tbody>${led.map((r) => `<tr><td>${r[0]}</td><td><code>${r[1]}</code></td><td><code>${r[2]}</code></td><td class="r num">${r[3].toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="4">쿠폰 · 포인트 사용 없음</td></tr>'}</tbody></table>
      <div class="dev-h">정산 원천 행 (settlement-service · 이벤트 ID 유니크로 멱등)</div>
      <table class="dev-tbl"><thead><tr><th>kind</th><th>매장</th><th class="r">금액</th><th class="r">PG 수수료</th></tr></thead><tbody>${stl.map((r) => `<tr><td><code>${r[0]}</code></td><td>${r[1]}</td><td class="r num">${r[2].toLocaleString()}</td><td class="r num">${r[3].toLocaleString()}</td></tr>`).join('')}</tbody></table>
      <div class="dev-note">매장별 합계: ${Object.entries(byStore).map(([k, v]) => `<b>${k}</b> 매출 ${won(v[0])} · 수수료 ${won(v[1])}`).join(' / ')}</div>`;
  }
  function renderDev() {
    const el = $('devPanel');
    el.hidden = !st.showCodes;
    if (!st.showCodes) return;
    const keep = el.querySelector('.dbody') ? el.querySelector('.dbody').scrollTop : 0;
    const body = { events: devEvents, api: devApi, slots: devSlots, money: devMoney }[st.devTab]();
    el.innerHTML = `<div class="dh"><b>개발자 보기</b><div class="dtabs">${DEV_TABS.map(([k, n]) => `<button data-dev-tab="${k}" aria-pressed="${st.devTab === k}">${n}</button>`).join('')}</div><button data-dev-close aria-label="닫기">✕</button></div><div class="dbody">${body}</div>`;
    el.querySelector('.dbody').scrollTop = keep;
  }
  function renderAll() { renderPhone(); renderStore(); renderDev(); dirty = false; updateLive(); }
  function updateLive() {
    $('clock').textContent = hhmmss(st.now); $('phClock').textContent = hhmm(st.now);
    document.querySelectorAll('[data-until]').forEach((el) => { const s = Number(el.dataset.until) - st.now; el.textContent = s > 60 ? Math.ceil(s / 60) + '분' : Math.max(0, Math.ceil(s)) + '초'; });
    document.querySelectorAll('[data-hold]').forEach((el) => { el.textContent = fmtLeft(Number(el.dataset.hold) - st.now); });
  }
  let last = performance.now(); let acc = 0;
  function frame(now) {
    const dt = Math.min(0.25, (now - last) / 1000); last = now;
    if (st.playing) { acc += dt * st.speed; const whole = Math.floor(acc); if (whole > 0) { acc -= whole; advance(whole); } }
    if (dirty) renderAll(); else updateLive();
    requestAnimationFrame(frame);
  }

  function setSpeedUi() {
    $('btnPlay').textContent = st.playing ? '⏸ 멈춤' : '▶ 계속'; $('btnPlay').setAttribute('aria-pressed', String(!st.playing));
    $('btnPlay').setAttribute('aria-label', st.playing ? '일시정지' : '재생');
  }
  $('btnPlay').addEventListener('click', () => { st.playing = !st.playing; setSpeedUi(); });
  $('btnSkip').addEventListener('click', () => { advance(300); renderAll(); });
  $('btnReset').addEventListener('click', () => { reset(); renderAll(); });
  const setDev = (on) => { st.showCodes = on; $('btnCodes').setAttribute('aria-pressed', String(on)); renderAll(); };
  $('btnCodes').addEventListener('click', () => setDev(!st.showCodes));
  $('devPanel').addEventListener('click', (e) => {
    if (e.target.closest('[data-dev-close]')) setDev(false);
    const t = e.target.closest('[data-dev-tab]'); if (t) { st.devTab = t.dataset.devTab; renderDev(); }
  });
  document.querySelectorAll('.switch-view button').forEach((b) => b.addEventListener('click', () => {
    document.body.dataset.view = b.dataset.view;
    document.querySelectorAll('.switch-view button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));

  function reset() {
    const dev = st ? st.showCodes : false;
    st = freshState(); st.showCodes = dev;
    advance(T(8, 30) - st.now); // 문 연 지 조금 지난 매장에서 시작
    st.log = st.log.slice(0, 12);
    setSpeedUi(); dirty = true;
  }
  reset();
  // 테스트 · 디버깅용 훅
  globalThis.__brewslotDemo = { get state() { return st; }, advance: (s) => { advance(s); renderAll(); } };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
