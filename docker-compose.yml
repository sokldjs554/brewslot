# 로컬 전체 실행: docker compose up --build
# 인프라만: docker compose up postgres kafka redis
name: brewslot

x-service: &service
  build:
    context: .
  restart: on-failure
  environment: &env
    DB_HOST: postgres
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP: kafka:9092
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brewslot
      POSTGRES_PASSWORD: brewslot
      POSTGRES_DB: brewslot
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "brewslot"]
      interval: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  order-service:
    <<: *service
    build: { context: ., args: { SERVICE: order-service } }
    ports: ["8081:8081"]

  payment-service:
    <<: *service
    build: { context: ., args: { SERVICE: payment-service } }
    ports: ["8082:8082"]

  loyalty-service:
    <<: *service
    build: { context: ., args: { SERVICE: loyalty-service } }
    ports: ["8083:8083"]

  settlement-service:
    <<: *service
    build: { context: ., args: { SERVICE: settlement-service } }
    environment:
      <<: *env
      PAYMENT_SERVICE_URL: http://payment-service:8082
    ports: ["8084:8084"]

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8085:8085"]

  dlt-console:
    build: { context: services/dlt-console }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      OPS_TOKEN: ${OPS_TOKEN:-local-ops-token}
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8090:8090"]

  n8n:
    image: n8nio/n8n:1.94.1
    profiles: ["automation"]
    environment:
      DLT_CONSOLE_URL: http://dlt-console:8090
      SETTLEMENT_URL: http://settlement-service:8084
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-http://localhost:9/unset}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Asia/Seoul
    volumes:
      - ./automation/n8n:/workflows:ro
    ports: ["5678:5678"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
