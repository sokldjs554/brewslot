apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: brewslot
labels:
  - pairs: { app.kubernetes.io/part-of: brewslot }
resources:
  - namespace.yaml
  - infra/postgres.yaml
  - infra/kafka.yaml
  - infra/redis.yaml
  - apps/order-service.yaml
  - apps/order-service-scaling.yaml
  - apps/payment-service.yaml
  - apps/loyalty-service.yaml
  - apps/settlement-service.yaml
  - apps/notification-service.yaml
  - apps/dlt-console.yaml
configMapGenerator:
  - name: brewslot-common
    literals:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP=kafka:9092
      - DATADOG_ENABLED=false
