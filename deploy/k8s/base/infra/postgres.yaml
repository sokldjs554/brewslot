# 로컬(kind)·데모용 단일 인스턴스. 운영에서는 관리형 DB(RDS 등)를 쓰고 이 매니페스트는 쓰지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # database-per-service: 서비스는 서로의 DB 를 직접 읽지 않는다 (infra/postgres/init.sql 과 동일)
  init.sql: |
    CREATE DATABASE order_db;
    CREATE DATABASE payment_db;
    CREATE DATABASE loyalty_db;
    CREATE DATABASE settlement_db;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ name: pg, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: brewslot }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: brewslot-db, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: brewslot-db, key: DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d brewslot"] }
            periodSeconds: 3
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
