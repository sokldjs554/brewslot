name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 커밋된 DB 마이그레이션이 수정되지 않았는지 검사
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE=HEAD~1; fi
          scripts/check-migrations.sh "$BASE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint · Unit · Integration(Testcontainers) · 실행계획 회귀 · API 드리프트 · E2E
        run: ./gradlew build --console=plain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Datadog 대시보드·모니터가 참조하는 지표가 코드에 있는지 검사
        run: python3 infra/datadog/check_metrics.py
      - name: 공개 데모(site/) 스케줄러 ↔ 서버 스케줄러 결과 일치 검증 (테스트 벡터 500개)
        run: node site/verify.mjs services/order-service/build/scheduler-vectors.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: dlt-console (FastAPI) — 단위 + 실제 Kafka 통합 테스트
        working-directory: services/dlt-console
        run: |
          pip install -q -e '.[dev]'
          pytest -q
      - name: plan-doctor (실행계획 진단 · high 발견 시 실패)
        working-directory: tools/plan-doctor
        run: |
          pip install -q -e '.[dev]'
          pytest -q
          python -m plan_doctor.cli '../../services/*/build/query-plans/*.json' --fail-on high --out plan-report.md
          cat plan-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
      - name: Upload query plans (plan-doctor 입력)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-plans
          path: '**/build/query-plans/*.json'

  n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: n8n 워크플로 import · 활성화 · 웹훅 실행 → Slack 메시지 내용 검증
        run: scripts/verify-n8n.sh
