# PR 마다 Claude Code 가 CLAUDE.md 규칙과 .claude/commands/review.md 체크리스트로 리뷰한다.
# 사용하려면 저장소 Settings → Secrets → Actions 에 ANTHROPIC_API_KEY 를 등록한다. 없으면 이 잡은 건너뛴다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            이 PR 을 리뷰해 주세요. CLAUDE.md 의 "반드시 지킬 규칙" 과 .claude/commands/review.md 의 체크리스트를 기준으로 합니다.
            - 문제가 있는 곳에만 인라인 코멘트를 남기고, 각 코멘트에 이유와 수정안을 적습니다.
            - 마지막에 요약 코멘트 하나: 위험도 높은 순 3가지 + 이 변경으로 생길 수 있는 장애 시나리오와 이를 잡을 테스트.
            - 확인하지 않은 동작을 단정하지 말고, 불확실하면 "확인 필요" 로 표시합니다.
